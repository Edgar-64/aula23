<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Controle de Acesso</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <link rel="stylesheet" href="manifest.json">

    <script src="sw.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family:
                -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: #fff;
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 24px;
            text-align: center;
        }

        h1 {
            font-size: 1.25rem;
            color: #1e293b;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #0369a1;
        }

        button.secondary {
            background: #e2e8f0;
            color: #334155;
        }

        button.secondary:hover {
            background: #cbd5e1;
        }

        button.faceId {
            background: #7c3aed;
        }

        button.faceId:hover {
            background: #6d28d9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #reader,
        #faceReader {
            width: 100%;
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }

        #faceReader {
            position: relative;
            background: #111827;
        }

        #faceVideo {
            width: 100%;
            display: block;
            transform: scaleX(-1);
        }

        #faceCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform: scaleX(-1);
        }

        .status-box {
            padding: 14px;
            margin-top: 8px;
            display: none;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .status-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .status-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .status-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Controle de Fluxo</h1>

    <p class="subtitle">
        Ponto Físico:
        <strong>SETOR-01</strong>
    </p>

    <div class="btn-group">

        <button id="btnNfc" onclick="iniciarLeituraNFC()">
            📡 Ler com Aproximação
        </button>

        <button class="secondary" id="btnQr" onclick="toggleQrReader()">
            📷 Ler com Câmera
        </button>

        <button class="faceId" id="btnFaceId" onclick="toggleFaceIdReader()">
            👤 Leitor facial
        </button>

    </div>

    <!-- LEITOR QR -->
    <div id="reader"></div>

    <!-- LEITOR FACIAL -->
    <div id="faceReader">

        <video
            id="faceVideo"
            autoplay
            muted
            playsinline>
        </video>

        <canvas id="faceCanvas"></canvas>

    </div>

    <div id="statusBox" class="status-box"></div>

</div>


<script>

const CODIGO_PONTO = "SETOR-01";

let qrScanner = null;
let lendoQR = false;


/* =========================================================
   FACE ID
   ========================================================= */

const FACE_MODEL_URL =
    "https://justadudewhohacks.github.io/face-api.js/models";

let faceModelsLoaded = false;
let faceStream = null;
let faceReaderAtivo = false;
let processandoFace = false;


/* =========================================================
   STATUS
   ========================================================= */

function exibirStatus(tipo, mensagem) {

    const box = document.getElementById("statusBox");

    box.className = `status-box status-${tipo}`;

    box.innerHTML = mensagem;

    box.style.display = "block";
}


/* =========================================================
   NFC
   ========================================================= */

async function iniciarLeituraNFC() {

    if (!("NDEFReader" in window)) {

        exibirStatus(
            "error",
            "NFC não é suportado neste navegador. Utilize o QR Code ou reconhecimento facial."
        );

        return;
    }

    try {

        const ndef = new NDEFReader();

        await ndef.scan();

        exibirStatus(
            "info",
            "📡 Aproxime o celular da tag NFC..."
        );

        ndef.onreading = (event) => {

            const serialNumber = event.serialNumber;

            console.log("NFC detectado:", serialNumber);

            exibirStatus(
                "info",
                `NFC detectado.<br>
                 UID: ${serialNumber}`
            );
        }

    } catch (error) {

        console.error("Erro no NFC:", error);

        exibirStatus(
            "error",
            "Erro ao iniciar NFC: " + error.message
        );
    }
}


/* =========================================================
   QR CODE
   ========================================================= */

async function toggleQrReader() {

    const readerDiv = document.getElementById("reader");
    const btnQr = document.getElementById("btnQr");

    if (lendoQR) {

        await pararLeitorQR();

        return;
    }

    /* Se o Face ID estiver aberto, fecha */
    if (faceReaderAtivo) {
        await pararLeitorFacial();
    }

    try {

        lendoQR = true;

        readerDiv.style.display = "block";

        btnQr.innerText = "⏹️ Parar Leitor QR";

        qrScanner = new Html5Qrcode("reader");

        await qrScanner.start(

            {
                facingMode: "environment"
            },

            {
                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                },

                aspectRatio: 1.0
            },

            async (decodedText) => {

                console.log(
                    "QR CODE LIDO:",
                    decodedText
                );

                await pararLeitorQR();

                await processarRegistro(decodedText);
            },

            (errorMessage) => {
                // Tentativas sem QR detectado são normais.
            }
        );

    } catch (error) {

        console.error(
            "Erro ao iniciar leitor QR:",
            error
        );

        lendoQR = false;

        readerDiv.style.display = "none";

        btnQr.innerText =
            "📷 Ler com Câmera";

        exibirStatus(
            "error",
            "Não foi possível acessar a câmera."
        );
    }
}


/* =========================================================
   PARA LEITOR QR
   ========================================================= */

async function pararLeitorQR() {

    const readerDiv =
        document.getElementById("reader");

    const btnQr =
        document.getElementById("btnQr");

    if (qrScanner) {

        try {

            if (lendoQR) {
                await qrScanner.stop();
            }

        } catch (error) {

            console.warn(
                "Erro ao parar leitor:",
                error
            );
        }

        try {
            qrScanner.clear();
        } catch (e) {}

        qrScanner = null;
    }

    lendoQR = false;

    readerDiv.style.display = "none";

    btnQr.innerText =
        "📷 Ler com Câmera";
}


/* =========================================================
   ENVIA TOKEN PARA BACKEND
   ========================================================= */

async function processarRegistro(token) {

    exibirStatus(
        "info",
        "🔍 Validando QR Code..."
    );

    token = token.trim();

    if (!token) {

        exibirStatus(
            "error",
            "QR Code vazio ou inválido."
        );

        return;
    }

    console.log(
        "Token enviado:",
        token
    );

    try {

        const response = await fetch(
            "validar_acesso.php",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    token: token
                })
            }
        );

        const resultado =
            await response.json();

        console.log(
            "Resposta do servidor:",
            resultado
        );

        if (
            response.ok &&
            resultado.status === "sucesso"
        ) {

            exibirStatus(
                "success",
                `<strong>✓ ACESSO LIBERADO!</strong><br>
                 ${resultado.mensagem}`
            );

            return;
        }

        exibirStatus(
            "error",
            `<strong>✕ ACESSO NEGADO</strong><br>
             ${resultado.mensagem ||
                "QR Code inválido ou expirado."}`
        );

    } catch (error) {

        console.error(
            "Erro na comunicação:",
            error
        );

        exibirStatus(
            "error",
            "Falha na comunicação com o servidor."
        );
    }
}


/* =========================================================
   CARREGAR MODELOS FACIAIS
   ========================================================= */

async function carregarModelosFaciais() {

    if (faceModelsLoaded) {
        return;
    }

    exibirStatus(
        "info",
        "🧠 Carregando reconhecimento facial..."
    );

    try {

        await faceapi.nets.tinyFaceDetector.loadFromUri(
            FACE_MODEL_URL
        );

        await faceapi.nets.faceLandmark68Net.loadFromUri(
            FACE_MODEL_URL
        );

        await faceapi.nets.faceRecognitionNet.loadFromUri(
            FACE_MODEL_URL
        );

        faceModelsLoaded = true;

        console.log(
            "Modelos faciais carregados."
        );

    } catch (error) {

        console.error(
            "Erro carregando modelos:",
            error
        );

        throw new Error(
            "Não foi possível carregar os modelos faciais."
        );
    }
}


/* =========================================================
   ABRIR / FECHAR FACE ID
   ========================================================= */

async function toggleFaceIdReader() {

    if (faceReaderAtivo) {

        await pararLeitorFacial();

        return;
    }

    /* Fecha QR caso esteja aberto */
    if (lendoQR) {
        await pararLeitorQR();
    }

    try {

        await carregarModelosFaciais();

        const faceReader =
            document.getElementById("faceReader");

        const video =
            document.getElementById("faceVideo");

        const canvas =
            document.getElementById("faceCanvas");

        faceStream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "user",
                    width: {
                        ideal: 640
                    },
                    height: {
                        ideal: 480
                    }
                },

                audio: false
            });

        video.srcObject =
            faceStream;

        await new Promise(resolve => {

            video.onloadedmetadata =
                resolve;

        });

        faceReader.style.display =
            "block";

        faceReaderAtivo =
            true;

        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;

        document.getElementById(
            "btnFaceId"
        ).innerText =
            "⏹️ Parar Leitor Facial";

        exibirStatus(
            "info",
            "👤 Posicione seu rosto diante da câmera..."
        );

        iniciarReconhecimentoFacial();

    } catch (error) {

        console.error(
            "Erro no Face ID:",
            error
        );

        exibirStatus(
            "error",
            "Não foi possível acessar a câmera ou carregar o reconhecimento facial."
        );

        await pararLeitorFacial();
    }
}


/* =========================================================
   RECONHECIMENTO FACIAL
   ========================================================= */

function iniciarReconhecimentoFacial() {

    const video =
        document.getElementById("faceVideo");

    const canvas =
        document.getElementById("faceCanvas");

    const intervalo =
        setInterval(async () => {

            if (!faceReaderAtivo) {

                clearInterval(intervalo);

                return;
            }

            if (
                processandoFace ||
                video.readyState < 2
            ) {
                return;
            }

            processandoFace = true;

            try {

                const deteccoes =
                    await faceapi
                        .detectAllFaces(
                            video,
                            new faceapi.TinyFaceDetectorOptions({
                                inputSize: 416,
                                scoreThreshold: 0.5
                            })
                        )
                        .withFaceLandmarks()
                        .withFaceDescriptors();

                const contexto =
                    canvas.getContext("2d");

                contexto.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                /* Nenhum rosto */
                if (deteccoes.length === 0) {

                    exibirStatus(
                        "info",
                        "👤 Nenhum rosto detectado. Posicione-se diante da câmera."
                    );

                    processandoFace = false;

                    return;
                }

                /* Mais de um rosto */
                if (deteccoes.length > 1) {

                    exibirStatus(
                        "error",
                        "⚠️ Mais de um rosto detectado. Apenas uma pessoa deve ficar diante da câmera."
                    );

                    processandoFace = false;

                    return;
                }

                const deteccao =
                    deteccoes[0];

                /* Confiança da detecção */
                if (
                    deteccao.detection.score < 0.60
                ) {

                    exibirStatus(
                        "info",
                        "👤 Rosto detectado, mas a imagem está pouco nítida."
                    );

                    processandoFace = false;

                    return;
                }

                exibirStatus(
                    "info",
                    "🔍 Rosto detectado. Identificando..."
                );

                const descriptor =
                    Array.from(
                        deteccao.descriptor
                    );

                const resultado =
                    await validarRosto(
                        descriptor
                    );

                if (resultado.sucesso) {

                    await pararLeitorFacial();

                    exibirStatus(
                        "success",
                        `<strong>✓ ACESSO LIBERADO!</strong><br>
                         Funcionário: ${resultado.funcionario}<br>
                         Matrícula: ${resultado.matricula || "-"}<br>
                         Método: Reconhecimento facial`
                    );

                } else {

                    exibirStatus(
                        "error",
                        `<strong>✕ ACESSO NEGADO</strong><br>
                         ${resultado.mensagem}`
                    );

                    /*
                     * Continua procurando.
                     * Assim a pessoa pode tentar novamente.
                     */
                    await new Promise(
                        resolve =>
                            setTimeout(resolve, 1500)
                    );
                }

            } catch (error) {

                console.error(
                    "Erro no reconhecimento:",
                    error
                );

                exibirStatus(
                    "error",
                    "Erro ao validar o rosto."
                );

            } finally {

                processandoFace =
                    false;
            }

        }, 1200);
}


/* =========================================================
   ENVIA ROSTO PARA PHP
   ========================================================= */

async function validarRosto(descriptor) {

    console.log(
        "Enviando descriptor facial..."
    );

    try {

        const response =
            await fetch(
                "validar_rosto.php",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        face_embedding:
                            descriptor,
                        codigo_ponto:
                            CODIGO_PONTO
                    })
                }
            );

        const resultado =
            await response.json();

        console.log(
            "Resposta Face ID:",
            resultado
        );

        return resultado;

    } catch (error) {

        console.error(
            error
        );

        return {
            sucesso: false,
            mensagem:
                "Falha na comunicação com o servidor."
        };
    }
}


/* =========================================================
   PARA LEITOR FACIAL
   ========================================================= */

async function pararLeitorFacial() {

    faceReaderAtivo =
        false;

    processandoFace =
        false;

    if (faceStream) {

        faceStream
            .getTracks()
            .forEach(track => {
                track.stop();
            });

        faceStream =
            null;
    }

    const video =
        document.getElementById("faceVideo");

    video.srcObject =
        null;

    document.getElementById(
        "faceReader"
    ).style.display =
        "none";

    document.getElementById(
        "btnFaceId"
    ).innerText =
        "👤 Leitor facial";
}


/* =========================================================
   LIMPA CÂMERA AO SAIR
   ========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (faceStream) {

            faceStream
                .getTracks()
                .forEach(track =>
                    track.stop()
                );
        }
    }
);

</script>

</body>
</html>
